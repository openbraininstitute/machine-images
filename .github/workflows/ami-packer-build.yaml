name: Build AMI with Packer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  PACKER_VERSION: "1.15.3"

permissions:
  id-token: write   # for OIDC auth to AWS
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    environment: sandbox-hpc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_AMI_DEPLOYMENT_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Packer
        uses: hashicorp/setup-packer@v3
        with:
          version: ${{ env.PACKER_VERSION }}

      - name: Packer Init
        run: packer init .
        working-directory: packer

      - name: Packer Validate
        run: packer validate -only='amazon-ebs.neurodamus' .
        working-directory: packer

      - name: Packer Build
        run: packer build -only='amazon-ebs.neurodamus' .
        working-directory: packer
